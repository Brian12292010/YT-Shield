      - name: Align Java and Kotlin JVM targets
        run: |
          cat >> extracted/YT_Shield_Android/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          name: Build YT Shield APK

on:
  push:
    branches: [main]
    paths:
      - 'YT_Shield_Android_v0.5.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          set -euxo pipefail
          mkdir extracted
          unzip -q YT_Shield_Android_v0.5.zip -d extracted
          test -f extracted/YT_Shield_Android/settings.gradle.kts
          test -f extracted/YT_Shield_Android/app/build.gradle.kts
      - name: Build debug APK
        run: |
          cd extracted/YT_Shield_Android
          gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT_Shield_APK
          path: extracted/YT_Shield_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
