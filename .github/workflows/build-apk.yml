name: Build YT Shield APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q YT_Shield_Android_v0.5.zip -d extracted
          WRAPPER=$(find extracted -name gradlew -type f | head -1)
          test -n "$WRAPPER"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: YT_Shield_APK
          path: extracted/**/build/outputs/apk/debug/*.apk
